name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'JumpingCoconut/Embleo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream into main and development
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Spreit/Embleo.git
          git fetch upstream main
          git fetch origin main development
          git checkout -B main origin/main
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo '::error::Upstream conflicts with fork main. Resolve manually; no changes were pushed.'
            exit 1
          fi
          git push origin main
          git checkout -B development origin/development
          if ! git merge --no-edit main; then
            git merge --abort
            echo '::error::Development conflicts with updated main. Main is current; resolve development manually.'
            exit 1
          fi
          git push origin development
